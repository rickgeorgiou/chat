<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>FSC Customer Details</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 24px;
    }

    .label {
      font-size: 13px;
      color: #666;
      margin-top: 20px;
    }

    .value {
      font-size: 22px;
      font-weight: 600;
      margin-top: 4px;
    }
  </style>
</head>
<body>

<h2>FSC Support</h2>

<div class="label">Customer</div>
<div class="value" id="customer"></div>

<div class="label">Department</div>
<div class="value" id="department"></div>

<script>
const params = new URLSearchParams(window.location.search);

document.getElementById("customer").textContent =
    params.get("customerName") || "Unknown";

document.getElementById("department").textContent =
    params.get("department") || "Unknown";
</script>

</body>
</html>
